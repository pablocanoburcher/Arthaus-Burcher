<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Result | ARTHAUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-surface: #141414;
            --color-border: #2a2a2a;
            --color-text: #f5f5f5;
            --color-text-muted: #888888;
            --color-accent: #a18a6c;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-container {
            text-align: center;
            padding: 3rem;
            max-width: 500px;
        }

        .result-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-icon.success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }

        .result-icon.pending {
            background: rgba(234, 179, 8, 0.1);
            color: #eab308;
        }

        .result-icon.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .result-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .result-message {
            color: var(--color-text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .result-reference {
            background: var(--color-surface);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .home-link {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--color-accent);
            color: var(--color-bg);
            text-decoration: none;
            font-weight: 500;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .home-link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-icon" id="resultIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1 class="result-title" id="resultTitle">Processing Payment</h1>
        <p class="result-message" id="resultMessage">Please wait while we confirm your payment status...</p>
        <div class="result-reference" id="resultReference"></div>
        <a href="/" class="home-link">Return to ARTHAUS</a>
    </div>

    <script>
        // Parse URL parameters from Wompi redirect
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('id');
        const reference = urlParams.get('env') === 'test' ? 'Test Transaction' : (urlParams.get('reference') || 'N/A');

        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultReference = document.getElementById('resultReference');

        // Display reference
        resultReference.textContent = `Reference: ${reference}`;

        // Check transaction status if we have an ID
        if (transactionId) {
            fetch(`https://production.wompi.co/v1/transactions/${transactionId}`)
                .then(res => res.json())
                .then(data => {
                    const status = data.data?.status;

                    if (status === 'APPROVED') {
                        resultIcon.className = 'result-icon success';
                        resultIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                        resultTitle.textContent = 'Payment Successful!';
                        resultMessage.textContent = 'Thank you for your purchase. You will receive an email confirmation shortly.';
                        // Clear cart
                        localStorage.removeItem('arthaus_cart');
                    } else if (status === 'PENDING') {
                        resultIcon.className = 'result-icon pending';
                        resultTitle.textContent = 'Payment Pending';
                        resultMessage.textContent = 'Your payment is being processed. We will notify you once it is confirmed.';
                    } else {
                        resultIcon.className = 'result-icon error';
                        resultIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
                        resultTitle.textContent = 'Payment Failed';
                        resultMessage.textContent = 'Unfortunately, your payment could not be processed. Please try again.';
                    }
                })
                .catch(err => {
                    console.error('Error checking transaction:', err);
                    resultTitle.textContent = 'Status Unknown';
                    resultMessage.textContent = 'We could not verify your payment status. Please check your email for confirmation.';
                });
        } else {
            resultTitle.textContent = 'No Transaction Found';
            resultMessage.textContent = 'No payment information was received. Please return to the store and try again.';
            resultReference.style.display = 'none';
        }
    </script>
</body>
</html>
